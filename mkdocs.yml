site_name: EdgeTX LuaDoc
site_description: Next-generation Lua API docs generated from EdgeTX source annotations
site_url: https://luadoc.edgetx.org/
docs_dir: docs-site
site_dir: site
theme:
  name: material
  logo: assets/edgetx-logo.svg
  favicon: assets/edgetx-logo.svg
  palette:
    primary: custom
    accent: custom
  features:
    - navigation.path
extra_css:
  - stylesheets/extra.css
extra_javascript:
  - javascripts/review-workbench.js
  - javascripts/version-switcher.js
  - javascripts/legacy-version-banner.js
  - javascripts/nav-section-links.js
extra:
  version:
    provider: mike
    default: latest
    alias: true
  legacy_version:
    enabled: false
    label: Legacy version
    message: This documentation version is preserved for reference and may not include later corrections or the newest docs structure.
nav:
  - EdgeTX LuaDoc: index.md
  - API Overview:
      - API Overview: api-overview/README.md
      - Lua version:
          - Lua version: api-overview/version-libraries/README.md
          - io Library: api-overview/version-libraries/io-library.md
      - Script Types:
          - Script Types: api-overview/script-types/README.md
          - One-Time Scripts: api-overview/script-types/one-time-scripts.md
          - Telemetry Scripts: api-overview/script-types/telemetry-scripts.md
          - Widget Scripts: api-overview/script-types/widget-scripts.md
          - Function Scripts: api-overview/script-types/function-scripts.md
          - Mixes Scripts: api-overview/script-types/mixes-scripts.md
      - Constants:
          - constants/README.md
          - Color Constants: constants/color-constants.md
          - Flags and Pattern Constants: constants/flags-and-pattern-constants.md
          - Key Event Constants: constants/key-event-constants.md
          - Logical Switch Function Constants: constants/logical-switch-function-constants.md
          - Screen Constants: constants/screen-constants.md
          - Special Character Constants: constants/special-character-constants.md
          - Special Function Constants: constants/special-function-constants.md
          - Touch Event Constants: constants/touch-event-constants.md
          - Widget Options Constants: constants/widget-options.md
          - Units: constants/units.md
      - Sources and Switches:
          - Sources and Switches: api-overview/internal-indexes/README.md
          - Sources: api-overview/internal-indexes/source-list.md
          - Switches: api-overview/internal-indexes/switch-positions-id.md
      - Fonts: api-overview/fonts.md
  - API Reference:
      - API Reference: api-reference/index.md
      - Audio-Sound: api-reference/audio-sound.md
      - Display LCD: api-reference/display-lcd.md
      - Display LVGL: api-reference/lvgl-for-lua.md
      - Filesystem: api-reference/filesystem.md
      - Lua Scripts: api-reference/lua-scripts.md
      - Model Functions: api-reference/model-functions.md
      - Radio Hardware: api-reference/radio-hardware.md
      - RF module: api-reference/rf-module.md
      - Serial Ports: api-reference/serial-ports.md
      - Sources: api-reference/sources.md
      - Switches: api-reference/switches.md
      - System: api-reference/system.md
      - Telemetry: api-reference/telemetry.md
      - Time: api-reference/time.md
      - Variables: api-reference/variables.md
  - Programming:
      - Programming: lua-api-programming/README.md
      - Lua Basics: api-overview/lua-basics.md
      - Data Exchange with the EdgeTX Model Setup: lua-api-programming/data-exchange-with-the-edgetx-model-setup.md
      - Drawing Flags and Colors: lua-api-programming/drawing-flags-and-colors.md
      - Init Function Syntax: lua-api-programming/init-function-syntax.md
      - Input Table Syntax: lua-api-programming/input-table-syntax.md
      - Loading Code Modules Dynamically: lua-api-programming/loading-code-modules-dynamically.md
      - Output Table Syntax: lua-api-programming/output-table-syntax.md
      - Return Statement Syntax: lua-api-programming/return-statement-syntax.md
      - Run Function Syntax: lua-api-programming/run-function-syntax.md
      - Saving Memory: lua-api-programming/saving-memory.md
      - Using Key and Touch Events: lua-api-programming/using-key-and-touch-events.md
      - Advanced Topics:
          - Overview: advanced-topics/README.md
          - Debugging techniques: advanced-topics/debugging-techniques.md
          - Lua data sharing across scripts: advanced-topics/lua-data-sharing-across-scripts.md
          - Speed/memory optimizaton tricks: advanced-topics/optimization-tricks.md
