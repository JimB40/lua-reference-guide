site_name: EdgeTX LuaDoc
site_description: Next-generation Lua API docs generated from EdgeTX source annotations
site_url: https://luadoc.edgetx.org/
docs_dir: website/md-docs
site_dir: site
exclude_docs: |
  migration/
  api-reference/review.md
  api-reference/review-*.md
  api-reference/module-*.md
  javascripts/review-workbench.js
theme:
  name: material
  logo: assets/edgetx-logo.svg
  favicon: assets/edgetx-logo.svg
  palette:
    primary: custom
    accent: custom
  features:
    - navigation.indexes
    - navigation.path
    - toc.integrate
    - toc.follow
extra_css:
  - stylesheets/extra-live-v2.css
extra_javascript:
  - javascripts/api-function-breadcrumb.js
  - javascripts/mobile-nav-inline.js
  - javascripts/legacy-version-banner.js
extra:
  version:
    provider: mike
    default: latest
    alias: true
  legacy_version:
    enabled: false
    label: Legacy version
    message: This documentation version is preserved for reference and may not include later corrections or the newest docs structure.
nav:
  - EdgeTX LuaDoc: index.md
  - API Overview:
      - API Overview: api-overview/README.md
      - Lua version:
          - Lua version: api-overview/version-libraries/README.md
          - io Library: api-overview/version-libraries/io-library.md
      - Script Types:
          - Script Types: api-overview/script-types/README.md
          - One-Time Scripts: api-overview/script-types/one-time-scripts.md
          - Telemetry Scripts: api-overview/script-types/telemetry-scripts.md
          - Widget Scripts: api-overview/script-types/widget-scripts.md
          - Function Scripts: api-overview/script-types/function-scripts.md
          - Mixes Scripts: api-overview/script-types/mixes-scripts.md
      - Constants:
          - api-overview/constants/README.md
          - Color Constants: api-overview/constants/color-constants.md
          - Flags and Pattern Constants: api-overview/constants/flags-and-pattern-constants.md
          - Key Event Constants: api-overview/constants/key-event-constants.md
          - Key Event Mechanism: api-overview/constants/key_events.md
          - Logical Switch Function Constants: api-overview/constants/logical-switch-function-constants.md
          - LVGL Constants: api-overview/constants/lvgl-constants.md
          - Screen Constants: api-overview/constants/screen-constants.md
          - Special Character Constants: api-overview/constants/special-character-constants.md
          - Special Function Constants: api-overview/constants/special-function-constants.md
          - Touch Event Constants: api-overview/constants/touch-event-constants.md
          - Widget Options Constants: api-overview/constants/widget-options.md
          - Units: api-overview/constants/units.md
      - Sources and Switches:
          - Sources and Switches: api-overview/internal-indexes/README.md
          - Sources: api-overview/internal-indexes/source-list.md
          - Switches: api-overview/internal-indexes/switch-positions-id.md
      - Fonts: api-overview/fonts.md
  - API Reference:
      - API Reference: api-reference/index.md
      - Audio-Sound: api-reference/audio-sound.md
      - Display LCD: api-reference/display-lcd.md
      - Display LVGL: api-reference/display-lvgl.md
      - Filesystem: api-reference/filesystem.md
      - Inputs: api-reference/key-inputs.md
      - Lua Scripts: api-reference/lua-scripts.md
      - Model Functions: api-reference/model-functions.md
      - Radio Hardware: api-reference/radio-hardware.md
      - RF module: api-reference/rf-module.md
      - Serial Ports: api-reference/serial-ports.md
      - Sources: api-reference/sources.md
      - Switches: api-reference/switches.md
      - System: api-reference/system.md
      - Telemetry: api-reference/telemetry.md
      - Time: api-reference/time.md
      - Variables: api-reference/variables.md
  - Programming:
      - Programming: programming/README.md
      - Basics:
          - Lua Basics: api-overview/lua-basics.md
          - Editor: programming/basics/editor.md
          - Files and Organization: programming/basics/files-and-organization.md
          - Naming: programming/basics/naming.md
          - Practicing: programming/basics/practicing.md
          - Testing: programming/basics/testing.md
          - Troubleshooting: programming/basics/troubleshooting.md
          - Memory: programming/basics/memory.md
          - Performance: programming/basics/performance.md
      - Core Concepts:
          - Using Flags and Colors: programming/core-concepts/drawing-flags-and-colors.md
          - Using LVGL Library: programming/core-concepts/lvgl-for-lua.md
          - Using Key and Touch Events: programming/core-concepts/using-key-and-touch-events.md
          - Data Exchange with the EdgeTX Model Setup: programming/core-concepts/data-exchange-with-the-edgetx-model-setup.md
      - Advanced Topics:
          - Debugging techniques: programming/advanced-topics/debugging-techniques.md
          - Loading Code Modules Dynamically: programming/core-concepts/loading-code-modules-dynamically.md
          - Lua data sharing across scripts: programming/advanced-topics/lua-data-sharing-across-scripts.md
          - Saving Memory: programming/core-concepts/saving-memory.md
          - Speed/memory optimizaton tricks: programming/advanced-topics/optimization-tricks.md
