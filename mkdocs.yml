          - Color Constants: md-docs/api-overview/constants/color-constants.md
          - Flags and Pattern Constants: md-docs/api-overview/constants/flags-and-pattern-constants.md
          - Key Event Constants: md-docs/api-overview/constants/key-event-constants.md
          - Logical Switch Function Constants: md-docs/api-overview/constants/logical-switch-function-constants.md
          - Screen Constants: md-docs/api-overview/constants/screen-constants.md
          - Special Character Constants: md-docs/api-overview/constants/special-character-constants.md
