          - X9 Lite / X9 Lite S: radios/frsky/frsky-x9-lite-x9-lite-s.md
          - X9D / X9D+ / X9D SE: radios/frsky/frsky-x9d-x9d-plus-x9d-plus-se.md
          - X9D+ 2019 / X9D+ 2019 SE: radios/frsky/frsky-x9dp2019.md
