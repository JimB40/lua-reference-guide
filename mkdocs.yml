site_name: EdgeTX LuaDoc
site_description: Next-generation Lua API docs generated from EdgeTX source annotations
site_url: https://luadoc.edgetx.org/
docs_dir: website
site_dir: site
theme:
  name: material
  logo: assets/edgetx-logo.svg
  favicon: assets/edgetx-logo.svg
  palette:
    primary: custom
    accent: custom
  features:
    - navigation.path
extra_css:
  - stylesheets/extra-live-v2.css
extra_javascript:
  - javascripts/api-function-breadcrumb.js
  - javascripts/mobile-nav-inline.js
  - javascripts/review-workbench.js
  - javascripts/version-switcher.js
  - javascripts/legacy-version-banner.js
  - javascripts/toc-visibility.js
extra:
  version:
    provider: mike
    default: latest
    alias: true
  legacy_version:
    enabled: false
    label: Legacy version
    message: This documentation version is preserved for reference and may not include later corrections or the newest docs structure.
nav:
  - EdgeTX LuaDoc: md-docs/index.md
  - API Overview:
      - API Overview: md-docs/api-overview/README.md
      - Lua version:
          - Lua version: md-docs/api-overview/version-libraries/README.md
          - io Library: md-docs/api-overview/version-libraries/io-library.md
      - Script Types:
          - Script Types: md-docs/api-overview/script-types/README.md
          - One-Time Scripts: md-docs/api-overview/script-types/one-time-scripts.md
          - Telemetry Scripts: md-docs/api-overview/script-types/telemetry-scripts.md
          - Widget Scripts: md-docs/api-overview/script-types/widget-scripts.md
          - Function Scripts: md-docs/api-overview/script-types/function-scripts.md
          - Mixes Scripts: md-docs/api-overview/script-types/mixes-scripts.md
      - Constants:
